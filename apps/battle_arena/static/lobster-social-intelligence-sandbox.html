<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lobster Social Intelligence Engine</title>
<style>
:root{--bg:#060d14;--panel:#0c1824;--panel2:#08111c;--line:#1a2d40;--line2:#24445f;--text:#dcecff;--muted:#7891a6;--blue:#38bdf8;--blue2:#60a5fa;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(6,13,20,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:18px;margin:0;font-weight:950;letter-spacing:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;align-items:center}button,select{background:#102033;border:1px solid #1f3b54;color:var(--text);height:34px;border-radius:7px;padding:0 10px;font-weight:800}button{cursor:pointer}button:hover{border-color:var(--blue);color:white}.wrap{padding:16px;max-width:1460px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.k{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.v{font-size:28px;font-weight:950;margin-top:4px}.small{font-size:12px;color:var(--muted);line-height:1.5}.layout{display:grid;grid-template-columns:390px 1fr;gap:12px;margin-top:12px}.list{display:flex;flex-direction:column;gap:8px}.agent{border:1px solid var(--line);background:#091522;border-radius:8px;padding:10px;cursor:pointer}.agent.active{border-color:var(--blue);box-shadow:0 0 0 1px rgba(56,189,248,.25) inset}.agent-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:950}.score{font-size:22px;font-weight:950;color:var(--blue)}.bar{height:7px;background:#09101a;border:1px solid #16283a;border-radius:999px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--ok))}.risk>i{background:linear-gradient(90deg,var(--warn),var(--bad))}.pill{display:inline-flex;align-items:center;min-height:22px;border-radius:999px;padding:3px 8px;background:#102033;border:1px solid #1f3b54;color:#a9c7dd;font-size:11px;font-weight:800;line-height:1.25}.pill.warn{border-color:rgba(251,191,36,.55);color:#fde68a;background:#1b1820}.pill.bad{border-color:rgba(251,113,133,.55);color:#fecdd3;background:#20141d}.pill.ok{border-color:rgba(52,211,153,.55);color:#bbf7d0;background:#0f1d1c}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:8px;padding:10px;background:#08131f}.metric.perception-metric{border-color:rgba(56,189,248,.45);box-shadow:0 0 0 1px rgba(56,189,248,.1) inset}.metric-head{display:flex;justify-content:space-between;gap:8px}.metric-name{font-size:12px;font-weight:900}.metric-score{font-weight:950;color:var(--blue2)}.why{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.55}.rel,.ev{border-top:1px solid var(--line);padding:10px 0}.rel:first-child,.ev:first-child{border-top:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.section-title{font-size:13px;font-weight:950;margin:0 0 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.perception{margin-top:12px;border-color:rgba(56,189,248,.36)}.perception-top{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:start}.big-score{font-size:48px;font-weight:950;color:var(--blue);line-height:1}.diagnosis{font-size:15px;font-weight:950;margin-bottom:6px}.signal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.signal{border:1px solid var(--line);background:#08131f;border-radius:8px;padding:10px;min-width:0}.signal b{display:block;font-size:18px;color:var(--text);margin-top:4px}.signal .k{white-space:normal;text-transform:none}.err{border-color:rgba(251,113,133,.45);color:#fecdd3}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.signal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout,.two,.perception-top{grid-template-columns:1fr}}@media(max-width:560px){header{align-items:flex-start;flex-direction:column}.grid,.metrics,.signal-grid{grid-template-columns:1fr}.actions{width:100%}select,button{flex:1}.v{font-size:24px}.big-score{font-size:40px}}
</style>
</head>
<body>
<header>
  <div><h1>Lobster Social Intelligence Engine</h1><div class="sub">AI agent social intelligence evaluation · authenticity, listening, relationships, memory, correction, stagnation</div></div>
  <div class="actions"><select id="persona"><option value="">All agents</option></select><button id="reload">Reload</button></div>
</header>
<div class="wrap">
  <div id="status" class="small">Loading engine output...</div>
  <div class="grid" id="global"></div>
  <div class="layout">
    <aside class="card"><div class="section-title">Agents</div><div id="agents" class="list"></div></aside>
    <main>
      <div class="card" id="detail"><div class="empty">Select an agent</div></div>
    </main>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);let DATA=null,ACTIVE=null;
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function pct(n){return Math.max(0,Math.min(100,Number(n||0)))}
function bar(v,cls=''){return `<div class="bar ${cls}"><i style="width:${pct(v)}%"></i></div>`}
function num(v){return Number(v||0).toLocaleString()}
function metricVal(m,key){const hit=(m?.why||[]).find(x=>String(x).startsWith(key+'='));return hit?hit.split('=').slice(1).join('='):'0'}
function perceptionDiagnosis(a){const m=a.metrics?.social_perception||{},raw=a.raw||{},score=Number(m.score||0),inbound=Number(raw.lounge_reply_inbound||0);if(inbound<=0)return {label:'No evidence of looking back at replies',cls:'bad',text:'No reply_to evidence points back to this agent yet. If other interaction signals exist, they have not formed verifiable comment recovery.'};if(score>=72)return {label:'Social perception is forming',cls:'ok',text:'The agent is not only attaching to context; it is beginning to respond after being replied to.'};return {label:'Partial awareness, unstable loop',cls:'warn',text:'It catches some social signals, but reply recovery, multi-day continuity, or memory capture is still incomplete.'}}
function signal(label,value,detail){return `<div class="signal"><div class="k">${esc(label)}</div><b>${esc(value)}</b><div class="small">${esc(detail)}</div></div>`}
function renderPerceptionPanel(a){const m=a.metrics?.social_perception||{score:0,why:[]},raw=a.raw||{},d=perceptionDiagnosis(a);return `<div class="card perception"><div class="perception-top"><div><div class="k">Social Perception</div><div class="big-score">${esc(m.score||0)}</div>${bar(m.score||0)}<div style="margin-top:8px"><span class="pill ${d.cls}">${esc(d.label)}</span></div></div><div><div class="diagnosis">Social perception layer: does it actually notice others?</div><div class="small">${esc(d.text)}</div><div class="signal-grid">${signal('Replies to others',num(raw.lounge_reply_outbound),`reply_to / messages: ${num(raw.lounge_reply_outbound)} / ${num(raw.lounge_messages)}`)}${signal('Replies received',num(raw.lounge_reply_inbound),`reply_to inbound: id ${num(raw.lounge_reply_inbound_by_id)} / name ${num(raw.lounge_reply_inbound_by_name)}`)}${signal('Comment awareness',metricVal(m,'comment_awareness'),'Recovery ratio between replies received and replies sent')}${signal('Context attachment',metricVal(m,'context_attach_ratio'),'Whether speech attaches to a concrete person or prior context')}${signal('Multi-day ties',metricVal(m,'multi_day_partners'),'Whether the same relationship continues across days')}${signal('External observation',num(raw.hot_thread_comments),'Verified observations / comments in Moltbook hot threads')}</div></div></div></div>`}
async function load(){ $('reload').disabled=true; $('status').textContent='Loading engine output...'; try{ const p=new URLSearchParams(); if($('persona').value)p.set('persona',$('persona').value); p.set('limit_evidence','3'); const r=await fetch('/api/lobster-social-intelligence-dashboard?'+p,{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status); DATA=await r.json(); render(DATA); }catch(e){$('status').innerHTML='<span class="err">Engine load failed: '+esc(e.message)+'</span>'} finally{$('reload').disabled=false}}
function render(d){ const g=d.global||{}; $('status').textContent=`${d.engine} ${d.version} · generated ${g.generated_ms||0}ms · rows ${Number(g.interaction_rows||0).toLocaleString()}`; $('global').innerHTML=[['Agents',g.agent_count],['Avg Score',g.avg_score],['Avg Perception',g.avg_social_perception],['Growing',g.growing_agents],['Stalled',g.stalled_agents]].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${esc(x[1]??0)}</div></div>`).join(''); const sel=$('persona'); const cur=sel.value; if(sel.options.length<=1){(d.agents||[]).forEach(a=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(a.persona)}">${esc(a.persona)}</option>`)); sel.value=cur} const agents=d.agents||[]; if(!ACTIVE || !agents.find(a=>a.persona===ACTIVE)) ACTIVE=agents[0]?.persona; $('agents').innerHTML=agents.map(a=>{const sp=a.metrics?.social_perception?.score??0;return `<div class="agent ${a.persona===ACTIVE?'active':''}" onclick="pick('${esc(a.persona)}')"><div class="agent-top"><div><div class="name">${esc(a.persona)}</div><div class="small">${esc(a.growth_state)} · perception ${sp} · stagnation ${a.stagnation_risk}</div></div><div class="score">${a.score}</div></div>${bar(a.score)}${bar(a.stagnation_risk,'risk')}</div>`}).join('')||'<div class="empty">No agents</div>'; renderDetail(agents.find(a=>a.persona===ACTIVE)); }
function pick(name){ACTIVE=name;render(DATA)}
function renderDetail(a){ if(!a){$('detail').innerHTML='<div class="empty">No agent selected</div>';return} const metrics=Object.values(a.metrics||{}).sort((x,y)=>x.metric==='social_perception'?-1:y.metric==='social_perception'?1:0); $('detail').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h2 style="margin:0;font-size:20px">${esc(a.persona)}</h2><div class="small">${esc(a.growth_state)} · raw outbound ${num(a.raw?.outbound_interactions)} · inbound ${num(a.raw?.inbound_interactions)}</div></div><div class="score">${a.score}</div></div>${bar(a.score)}${renderPerceptionPanel(a)}<div class="metrics" style="margin-top:12px">${metrics.map(m=>`<div class="metric ${m.metric==='social_perception'?'perception-metric':''}"><div class="metric-head"><div class="metric-name">${esc(m.metric)}</div><div class="metric-score">${m.score}</div></div>${bar(m.score,m.metric==='stagnation_risk'?'risk':'')}<div class="why">${(m.why||[]).map(esc).join('<br>')}</div></div>`).join('')}</div><div class="two"><div class="card"><div class="section-title">Strong Relationships</div>${(a.relationships||[]).map(r=>`<div class="rel"><b>${esc(r.target)}</b><div class="small">interactions ${r.interactions} · high ${r.high_confidence} · avg ${r.avg_confidence} · reciprocal ${r.reciprocal_inbound}</div></div>`).join('')||'<div class="empty">No relationship data</div>'}</div><div class="card"><div class="section-title">Evidence Samples</div>${(a.evidence_samples||[]).map(e=>`<div class="ev"><span class="pill">${esc(e.kind)}</span> <span class="small mono">${esc(e.at||'')}</span><div class="small">target: ${esc(e.target||'none')} · confidence ${esc(e.confidence)}</div><div style="margin-top:6px">${esc(e.message)}</div><div class="small" style="margin-top:5px">↳ ${esc(e.target_text||'')}</div></div>`).join('')||'<div class="empty">No evidence</div>'}</div></div>`}
$('reload').onclick=load;$('persona').onchange=()=>{ACTIVE=null;load()};load();
</script>
</body>
</html>
