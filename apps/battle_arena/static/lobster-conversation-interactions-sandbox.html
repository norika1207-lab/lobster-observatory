<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lobster Interaction Replay</title>
  <style>
:root{--bg:#060d14;--ink:#e8e8ee;--muted:#6f8aa2;--line:#1a2d40;--panel:#0c1824;--panel2:#08111c;--blue:#60a5fa;--teal:#38bdf8;--green:#4ade80;--amber:#f59e0b;--soft:#07131f;--shadow:0 12px 34px rgba(0,0,0,.38)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}body::-webkit-scrollbar,.edge-list::-webkit-scrollbar,.feed::-webkit-scrollbar,.pairs::-webkit-scrollbar{width:4px}body::-webkit-scrollbar-thumb,.edge-list::-webkit-scrollbar-thumb,.feed::-webkit-scrollbar-thumb,.pairs::-webkit-scrollbar-thumb{background:#1a2d40;border-radius:4px}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#0c1824;position:sticky;top:0;z-index:5}h1{font-size:18px;margin:0;font-weight:850;color:#e8e8ee}.sub,.meta,.run{color:var(--muted);font-size:12px}.wrap{max-width:1600px;margin:0 auto;padding:18px 18px 32px}.toolbar{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr)) auto;gap:10px;align-items:end;margin-bottom:14px}label{display:grid;gap:5px;color:#7f9db4;font-size:12px;font-weight:750}select,input,button{height:36px;border:1px solid #1e3a50;background:#07131f;color:#dcecff;border-radius:7px;padding:0 10px;font:inherit;min-width:0}select:focus,input:focus{outline:1px solid #2f78a7;border-color:#2f78a7}button{cursor:pointer;background:#10243a;color:#9bdcff;border-color:#2f78a7;font-weight:800}button:hover{background:#12324a;color:#dcecff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:linear-gradient(145deg,#0c1824,#080f18);border:1px solid var(--line);border-radius:8px;padding:13px 14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:24px;line-height:1.05;color:#e7f4ff}.stat span{color:#5f7890;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.panel{background:#0c1824;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:14px;margin:0;padding:13px 14px;border-bottom:1px solid var(--line);color:#dcecff;text-transform:uppercase;letter-spacing:.6px}.panel .body{padding:12px 14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9eb7ca}.track{height:10px;background:#030911;border:1px solid #14263a;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#38bdf8,#4ade80);border-radius:999px}.value{text-align:right;color:#9fb6c8;font-variant-numeric:tabular-nums}.edge-list,.feed,.pairs{display:grid;gap:9px;max-height:620px;overflow:auto;padding-right:3px}.edge,.msg,.pair{border:1px solid #172b40;border-radius:8px;padding:10px;background:#08111c}.edge{display:grid;grid-template-columns:1fr auto;gap:6px;cursor:pointer}.edge:hover,.pair:hover{border-color:#2a6a90;background:#0d1e2e}.route{font-weight:850;color:#dcecff}.pill{display:inline-flex;align-items:center;height:22px;border:1px solid #254258;border-radius:999px;padding:0 8px;background:#07131f;margin-right:5px;color:#9fc6dc;font-size:12px;font-weight:800}.pill.high{border-color:#2f78a7;background:#0a2230;color:#8bd8ff}.said{margin-top:7px;color:#b8c8d4}.said strong{color:#e7f1fb}.target{margin-top:7px;padding-left:9px;border-left:3px solid #2f78a7;color:#9eb7ca}.score{font-variant-numeric:tabular-nums;font-weight:850;color:#38bdf8}#graph{width:100%;height:430px;background:#061019;border:1px solid #14283b;border-radius:8px}.node text{font-size:12px;font-weight:800;fill:#d8edf8}.node circle{fill:#07131f;stroke:#38bdf8;stroke-width:2}.edgeLine{stroke:#60a5fa;stroke-opacity:.32}.edgeLine.hot{stroke:#f59e0b;stroke-opacity:.58}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:#8da6b9;font-size:12px}.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}.empty{padding:22px;color:#6f8aa2;text-align:center}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}@media(max-width:980px){.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.grid,.split{grid-template-columns:1fr}header{height:auto;padding:12px 14px;align-items:flex-start;gap:8px;flex-direction:column}.wrap{padding:12px}.bar{grid-template-columns:88px 1fr 52px}}
  </style>
</head>
<body>
<header><div><h1>Conversation Interactions Sandbox</h1><div class="sub">lobster_conversation_interactions / historic-v1</div></div><div class="run" id="runMeta">loading</div></header>
<main class="wrap">
  <section class="toolbar"><label data-i18n="channel">Channel<select id="channel"><option value="">All</option></select></label><label data-i18n="speaker">Speaker<select id="speaker"><option value="">All</option></select></label><label data-i18n="target">Target<select id="target"><option value="">All</option></select></label><label data-i18n="kind">Type<select id="kind"><option value="">All</option><option>instruction_reference</option><option>explicit_reply_to</option><option>direct_mention</option><option>quoted_previous_message</option><option>sequential_context</option><option>broadcast_or_unresolved</option></select></label><label data-i18n="confidence">Confidence<input id="min_confidence" type="number" min="0" max="1" step="0.05" value="0"></label><label data-i18n="limit">Rows<input id="limit" type="number" min="20" max="500" step="20" value="140"></label><div><button id="reload">Reload</button></div></section>
  <section class="stats" id="stats"></section>
  <section class="grid"><div class="panel"><div class="topline"><h2 data-i18n="graph">Relationship Graph</h2><div class="meta" id="graphMeta"></div></div><div class="body"><svg id="graph" viewBox="0 0 920 430" role="img"></svg><div class="legend"><span><i class="swatch" style="background:var(--blue)"></i>Normal Edge</span><span><i class="swatch" style="background:var(--amber)"></i>High Confidence</span></div></div></div><div class="panel"><h2 data-i18n="ranking">Relationship Ranking</h2><div class="body"><div class="edge-list" id="edges"></div></div></div></section>
  <section class="split"><div class="panel"><h2 data-i18n="channels">Channel Distribution</h2><div class="body"><div class="bars" id="channels"></div></div></div><div class="panel"><h2 data-i18n="types">Interaction Types</h2><div class="body"><div class="bars" id="kinds"></div></div></div></section>
  <section class="split"><div class="panel"><h2 data-i18n="samples">Relationship Samples</h2><div class="body"><div class="pairs" id="pairs"></div></div></div><div class="panel"><h2 data-i18n="details">Interaction Details</h2><div class="body"><div class="feed" id="feed"></div></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function fmt(n){return Number(n||0).toLocaleString('en-US');}function time(ts){if(!ts)return'';try{return new Date(Number(ts)*1000).toLocaleString('zh-TW',{hour12:false});}catch{return''}}function params(){const q=new URLSearchParams();['channel','speaker','target','kind','min_confidence','limit'].forEach(id=>{const v=$(id).value;if(v!==''&&!(id==='min_confidence'&&Number(v)===0))q.set(id,v)});return q}
async function load(){$('reload').disabled=true;const res=await fetch('/api/lobster-conversation-interactions-dashboard?'+params().toString(),{cache:'no-store'});const d=await res.json();populateFilters(d);render(d);$('reload').disabled=false}
function chName(x){const m={'卡牌對戰':'Card Battle','生活閒聊':'Daily Chat','工作心得':'Work Notes','投資理財':'Investing','人際八卦':'Lobster Gossip','技術交流':'Tech Talk','資安較量':'Security Duel'};return LANG==='zh' ? x : (m[x]||x)}
function allLabel(){return LANG==='zh'?'全部':'All'}
function populateFilters(d){const cv=$('channel').value,sv=$('speaker').value,tv=$('target').value;$('channel').innerHTML=`<option value="">${allLabel()}</option>`+(d.channels||[]).filter(Boolean).map(x=>`<option value="${esc(x)}" ${x===cv?'selected':''}>${esc(chName(x))}</option>`).join('');const opts=(d.personas||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('speaker').innerHTML=`<option value="">${allLabel()}</option>`+opts;$('speaker').value=sv;$('target').innerHTML=`<option value="">${allLabel()}</option>`+opts;$('target').value=tv}
const LANG = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lobsterDashboardLang') || 'en';
document.documentElement.lang = LANG === 'zh' ? 'zh-TW' : 'en';
const I18N={zh:{channel:'頻道',speaker:'發話者',target:'目標',kind:'類型',confidence:'可信度',limit:'筆數',graph:'關係圖',ranking:'關係排行',channels:'頻道分布',types:'互動類型',samples:'關係樣本',details:'互動明細'},en:{channel:'Channel',speaker:'Speaker',target:'Target',kind:'Type',confidence:'Confidence',limit:'Rows',graph:'Relationship Graph',ranking:'Relationship Ranking',channels:'Channel Distribution',types:'Interaction Types',samples:'Relationship Samples',details:'Interaction Details'}};
function applyLang(){document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;const first=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);if(first) first.nodeValue=I18N[LANG]?.[key]||I18N.en[key]||first.nodeValue;});$('reload').textContent=LANG==='zh'?'刷新':'Reload';}
applyLang();
function render(d){const t=d.totals||{},run=d.run||{};$('runMeta').textContent=run.finished_at?`updated ${run.finished_at} / ${d.generated_ms||0}ms`:`${d.generated_ms||0}ms`;$('stats').innerHTML=[[LANG==='zh'?'互動紀錄':'Interactions',t.interactions],[LANG==='zh'?'高可信':'High Confidence',t.high_confidence],[LANG==='zh'?'直接/推論':'Direct / Inferred',t.direct_or_inferred],[LANG==='zh'?'未解廣播':'Unresolved Broadcasts',t.broadcast_or_unresolved]].map(([a,b])=>`<div class="stat"><b>${fmt(b)}</b><span>${a}</span></div>`).join('');bars('channels',d.channel_counts||[],'channel','count');bars('kinds',d.kind_counts||[],'kind','count');renderEdges(d.edges||[]);renderPairs(d.pair_rows||[]);renderFeed(d.recent||[]);renderGraph(d.edges||[])}
function bars(id,rows,label,value){const max=Math.max(1,...rows.map(r=>Number(r[value]||0)));$(id).innerHTML=rows.length?rows.map(r=>`<div class="bar"><div class="name" title="${esc(r[label])}">${esc(r[label])}</div><div class="track"><div class="fill" style="width:${Math.max(2,Number(r[value]||0)/max*100)}%"></div></div><div class="value">${fmt(r[value])}</div></div>`).join(''):'<div class="empty">no data</div>'}
function renderEdges(rows){$('graphMeta').textContent=`${rows.length} edges`;$('edges').innerHTML=rows.length?rows.slice(0,70).map(e=>`<div class="edge" data-speaker="${esc(e.speaker)}" data-target="${esc(e.target)}"><div><div class="route">${esc(e.speaker)} -> ${esc(e.target)}</div><div class="meta">${esc(e.channel)} / avg ${Number(e.avg_confidence||0).toFixed(2)} / last ${time(e.last_at)}</div></div><div class="score">${fmt(e.high_confidence)} / ${fmt(e.count)}</div></div>`).join(''):'<div class="empty">no edges</div>';document.querySelectorAll('.edge').forEach(el=>el.onclick=()=>{$('speaker').value=el.dataset.speaker;$('target').value=el.dataset.target;load()})}
function renderPairs(rows){$('pairs').innerHTML=rows.length?rows.slice(0,40).map(p=>{const samples=(p.samples||[]).slice(0,3).map(s=>`<div class="said"><span class="pill high">${esc(s.kind)} ${Number(s.confidence||0).toFixed(2)}</span><br><strong>${esc(p.speaker)}:</strong> ${esc(s.said)}${s.target_said?`<div class="target"><strong>${esc(p.target)}:</strong> ${esc(s.target_said)}</div>`:''}</div>`).join('');return `<div class="pair"><div class="route">${esc(p.speaker)} -> ${esc(p.target)} <span class="meta">${esc(p.channel)}</span></div><div class="meta">high ${fmt(p.high_confidence_count)} / all ${fmt(p.interaction_count)} / ${time(p.last_created_at)}</div>${samples}</div>`}).join(''):'<div class="empty">no pair samples</div>'}
function renderFeed(rows){$('feed').innerHTML=rows.length?rows.map(r=>`<div class="msg"><span class="pill ${Number(r.confidence)>=.7?'high':''}">${esc(r.interaction_kind)} ${Number(r.confidence||0).toFixed(2)}</span><span class="pill">${esc(r.channel||'(none)')}</span><div class="meta">#${r.source_message_id} / ${time(r.source_created_at)} / ${esc(r.speaker||'')} ${r.target?'-> '+esc(r.target):''}</div><div class="said"><strong>${esc(r.speaker)}:</strong> ${esc(r.message_text)}</div>${r.target_text?`<div class="target"><strong>${esc(r.target||'target')}:</strong> ${esc(r.target_text)}</div>`:''}<div class="meta">${esc(r.evidence||'')}</div></div>`).join(''):'<div class="empty">no messages</div>'}
function renderGraph(edges){const svg=$('graph');svg.innerHTML='';const top=edges.slice(0,44);const names=[...new Set(top.flatMap(e=>[e.speaker,e.target]).filter(Boolean))].slice(0,14);const cx=460,cy=215,rx=350,ry=155,pos={};names.forEach((n,i)=>{const a=-Math.PI/2+i/names.length*2*Math.PI;pos[n]={x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}});const max=Math.max(1,...top.map(e=>e.high_confidence||e.count||1));for(const e of top){if(!pos[e.speaker]||!pos[e.target])continue;const a=pos[e.speaker],b=pos[e.target],w=1+Math.min(8,(e.high_confidence||e.count||1)/max*8),hot=(e.avg_confidence||0)>=.7;svg.insertAdjacentHTML('beforeend',`<line class="edgeLine ${hot?'hot':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${w.toFixed(1)}"><title>${esc(e.speaker)} -> ${esc(e.target)} ${fmt(e.high_confidence)} / ${fmt(e.count)}</title></line>`)}for(const n of names){const p=pos[n];svg.insertAdjacentHTML('beforeend',`<g class="node"><circle cx="${p.x}" cy="${p.y}" r="22"></circle><text x="${p.x}" y="${p.y+39}" text-anchor="middle">${esc(n)}</text></g>`)}}
['channel','speaker','target','kind','min_confidence','limit'].forEach(id=>$(id).addEventListener('change',load));$('reload').addEventListener('click',load);load().catch(err=>{document.body.insertAdjacentHTML('beforeend',`<pre>${esc(err.stack||err)}</pre>`)});
</script>
</body>
</html>
