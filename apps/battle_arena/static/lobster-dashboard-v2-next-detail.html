<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人 Lobster Detail · V2-NEXT</title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1525; --surface:#141a2d; --surface2:#1a2138;
  --border:#27314a; --border2:#384465;
  --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  --accent:#38bdf8; --accent2:#0ea5e9;
  --green:#22c55e; --yellow:#eab308; --orange:#f97316; --red:#ef4444; --purple:#a855f7;
  --gold:#fbbf24; --rose:#f43f5e; --teal:#14b8a6; --blue:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,'Helvetica Neue','PingFang TC',sans-serif;
  font-size:13px; line-height:1.5;
  min-height:100vh;
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}
code,pre{font-family:'SF Mono','Monaco','Menlo',monospace;font-size:11px}

/* ── Top bar ── */
.topbar{
  background:linear-gradient(180deg,var(--surface) 0%,var(--bg2) 100%);
  border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);
}
.lob-head{display:flex;align-items:center;gap:14px}
.back-link{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);padding:6px 12px;border-radius:6px;
  font-size:11px;
}
.back-link:hover{border-color:var(--accent);color:var(--accent)}
.lob-title{font-size:20px;font-weight:900;letter-spacing:0.3px}
.lob-sub{color:var(--text2);font-size:12px}
.mbti-chip{
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);
}
.occ-chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px;margin-left:8px}
.occ-chip.teacher{background:#1e3a8a;color:#dbeafe;border:1px solid #3b82f6}
.occ-chip.investigator{background:#581c87;color:#f3e8ff;border:1px solid #a855f7}
.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--border);
}
.status-pill.normal{color:var(--green);border-color:var(--green)}
.status-pill.pressure{color:var(--yellow);border-color:var(--yellow)}
.status-pill.crisis{color:var(--red);border-color:var(--red);background:#2a0d10}
.status-pill.deletion_candidate{color:var(--red);border-color:var(--red);background:#2a0d10;animation:pulse 2s infinite}
.status-pill.in_ritual{color:var(--purple);border-color:var(--purple)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 12px rgba(239,68,68,0.4)}}

.btn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;
  font-size:11px;font-family:inherit;
}
.btn:hover{background:var(--border);border-color:var(--accent)}

/* ── Tab nav ── */
.tab-nav{
  display:flex;gap:2px;padding:0 20px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  overflow-x:auto;position:sticky;top:53px;z-index:90;
}
.tab-btn{
  background:transparent;border:none;color:var(--text2);
  padding:11px 16px;font-size:12px;cursor:pointer;
  border-bottom:2.5px solid transparent;transition:all .12s;
  font-family:inherit;white-space:nowrap;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab-btn.v1{margin-left:auto;color:var(--orange)}
.tab-btn.v1.active{color:var(--orange);border-bottom-color:var(--orange)}

.tab-pane{display:none;padding:18px 20px;max-width:1600px;margin:0 auto}
.tab-pane.active{display:block}

/* ── Generic cards / sections ── */
.section{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:14px;
}
.section-head{
  font-size:13px;font-weight:900;color:var(--text);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
.section-head .sub{font-size:10px;color:var(--text3);font-weight:400;margin-left:auto}

.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}

.kv-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:12px;
}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--border)}
.kv-k{color:var(--text3)}
.kv-v{color:var(--text);font-weight:600}
.kv-v.crisis{color:var(--red)}
.kv-v.warn{color:var(--orange)}
.kv-v.good{color:var(--green)}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  padding:10px 12px;border-radius:8px;
}
.stat-card-label{font-size:10px;color:var(--text3);text-transform:uppercase}
.stat-card-val{font-size:20px;font-weight:900;color:var(--text);margin-top:2px}
.stat-card-sub{font-size:10px;color:var(--text2)}
.stat-card.warn{border-color:var(--orange)}
.stat-card.warn .stat-card-val{color:var(--orange)}
.stat-card.crisis{border-color:var(--red);background:linear-gradient(180deg,var(--bg2) 0%,#1a0a0c 100%)}
.stat-card.crisis .stat-card-val{color:var(--red)}
.stat-card.good{border-color:var(--green)}
.stat-card.good .stat-card-val{color:var(--green)}
.stat-card.brain{border-color:var(--accent)}
.stat-card.brain .stat-card-val{color:var(--accent)}

.bar-track{height:6px;background:#0a1018;border-radius:4px;overflow:hidden;border:1px solid var(--border);margin-top:6px}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}

.tag{
  display:inline-block;background:var(--bg2);border:1px solid var(--border);
  color:var(--text2);font-size:10px;padding:2px 7px;border-radius:10px;
  margin:2px 3px 2px 0;
}
.tag.warn{border-color:var(--orange);color:var(--orange)}
.tag.good{border-color:var(--green);color:var(--green)}
.tag.purple{border-color:var(--purple);color:var(--purple);background:#1a0d28}

/* ── Specialised UI ── */
.theory-row{
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;margin-bottom:5px;cursor:pointer;
  font-size:11px;display:flex;justify-content:space-between;gap:8px;
}
.theory-row:hover{border-color:var(--accent);background:var(--surface2)}
.theory-row b{color:var(--text);font-weight:700}
.theory-row span{color:var(--text3);font-size:10px}
.theory-fact{
  display:none;padding:8px 10px;background:var(--bg);
  border-left:2px solid var(--accent);font-size:11px;color:var(--text2);
  margin:-5px 0 8px 0;border-radius:0 6px 6px 0;line-height:1.6;
}
.theory-fact.open{display:block}

.principle-item{
  background:var(--bg2);border-left:3px solid var(--gold);
  padding:9px 12px;margin-bottom:6px;border-radius:0 6px 6px 0;
  font-size:12px;color:var(--text2);line-height:1.6;
}
.principle-num{color:var(--gold);font-weight:900;margin-right:8px}

.skel-item{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;padding:7px 10px;margin-bottom:4px;
  font-size:11px;color:var(--text2);
}
.skel-item .meta{font-size:10px;color:var(--text3);margin-top:3px}

.ban-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:3px;
}
.ban-word{
  background:#2a0d10;border:1px solid #5a1a20;
  color:#fda4af;font-size:10px;padding:3px 6px;border-radius:4px;
  text-align:center;font-family:'SF Mono',monospace;
}

.peer-jac-row{
  display:grid;grid-template-columns:120px 1fr 60px 60px;gap:8px;
  padding:5px 0;border-bottom:1px dashed var(--border);font-size:11px;align-items:center;
}
.peer-jac-row b{color:var(--text)}
.peer-jac-bar{height:4px;background:#0a1018;border-radius:2px;overflow:hidden}
.peer-jac-fill{height:100%;background:linear-gradient(90deg,var(--accent) 0%,var(--orange) 50%,var(--red) 100%)}

.divine-row{
  background:var(--bg2);border-left:3px solid var(--purple);
  padding:9px 12px;margin-bottom:6px;border-radius:0 6px 6px 0;
  font-size:11px;
}
.divine-row .when{color:var(--text3);font-size:10px;float:right}
.divine-row .type{font-weight:900;color:var(--gold)}

.lounge-row{
  background:var(--bg2);border:1px solid var(--border);
  padding:7px 10px;margin-bottom:5px;border-radius:6px;font-size:11px;
}
.lounge-row .meta{font-size:10px;color:var(--text3);margin-bottom:3px}
.lounge-row .channel{color:var(--accent);font-weight:700}

.violation-row{
  background:#1a0d10;border:1px solid #3a1a20;border-radius:6px;
  padding:7px 10px;margin-bottom:4px;font-size:11px;color:#fda4af;
}
.violation-row .meta{color:var(--text3);font-size:10px;margin-bottom:3px}

.activation-row{
  display:grid;grid-template-columns:120px 50px 1fr;gap:8px;
  padding:4px 0;font-size:11px;align-items:center;
}
.activation-bar{height:4px;background:#0a1018;border-radius:2px;overflow:hidden}
.activation-fill{height:100%;background:var(--accent)}

iframe.v1-frame{
  width:100%;height:calc(100vh - 120px);
  border:1px solid var(--border);border-radius:8px;background:#000;
}

#loading{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);padding:20px 30px;border-radius:10px;
  border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;gap:12px;
}
.spinner{width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

.empty-msg{color:var(--text3);font-size:11px;padding:14px;text-align:center;font-style:italic}

/* big soul radar */
.soul-big-wrap{display:flex;align-items:center;gap:18px}
.soul-big-svg{flex-shrink:0}
.soul-legend{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}
.soul-legend-item{display:flex;justify-content:space-between;padding:3px 8px;background:var(--bg2);border-radius:5px}
.soul-legend-item b{font-weight:700}
</style>
</head>

<body>
<div class="topbar">
  <div class="lob-head">
    <a href="/lobster/dashboard/v2-next" class="back-link">← 觀察站</a>
    <span class="lob-title" id="lob-title">人 載入中…</span>
    <span class="mbti-chip" id="mbti-chip">—</span>
    <span id="occ-chip-host"></span>
    <span class="status-pill" id="status-pill">—</span>
  </div>
  <div class="lob-head">
    <span class="lob-sub" id="last-update">—</span>
    <button class="btn" onclick="loadDetail()">↻</button>
  </div>
</div>

<nav class="tab-nav" id="tab-nav">
  <button class="tab-btn active" data-tab="overview">📊 概覽</button>
  <button class="tab-btn" data-tab="brain">🧠 腦模組</button>
  <button class="tab-btn" data-tab="occupation">🎓 職業</button>
  <button class="tab-btn" data-tab="template-survival">🔥 模板生存</button>
  <button class="tab-btn" data-tab="mirror">👁 鏡像診斷</button>
  <button class="tab-btn" data-tab="divine">⚡ 神明歷史</button>
  <button class="tab-btn" data-tab="lounge-history">💬 發言歷史</button>
  <button class="tab-btn v1" data-tab="v1">📋 V1 完整檢視 (11 tabs)</button>
</nav>

<div class="tab-pane active" data-pane="overview" id="pane-overview"></div>
<div class="tab-pane" data-pane="brain" id="pane-brain"></div>
<div class="tab-pane" data-pane="occupation" id="pane-occupation"></div>
<div class="tab-pane" data-pane="template-survival" id="pane-template-survival"></div>
<div class="tab-pane" data-pane="mirror" id="pane-mirror"></div>
<div class="tab-pane" data-pane="divine" id="pane-divine"></div>
<div class="tab-pane" data-pane="lounge-history" id="pane-lounge-history"></div>
<div class="tab-pane" data-pane="v1" id="pane-v1"></div>

<div id="loading"><div class="spinner"></div><span>載入詳細資料…</span></div>

<script>
const COLOR={hexclaw:'#3ab4e8',pincerbot:'#f0882a',norika_oda:'#e8b84b',vortexiq:'#f06080',
  snaplex:'#b067f5',prismbit:'#2dcfbb',clawtrix:'#7b82f0',ragclaw:'#7ec850',
  blazepaw:'#fb923c',stonefang:'#8b6f4e',elder:'#e2c275',
  emberling:'#fda4af',sparkrill:'#fde047',gauntlet:'#f43f5e',rushfin:'#fbbf24',
  nullpinch:'#a78bfa',brineledger:'#67e8f9',omenwake:'#86efac',mirrorcalm:'#67e8f9',
  flarecub:'#fb923c',basaltrook:'#a8a29e'};
const STATUS_ZH={normal:'🟢 正常',pressure:'🟡 壓力',crisis:'🔴 危機',
  in_ritual:'🟣 儀式中',deletion_candidate:'⚠ 候選刪除',stale:'🟠 停滯'};
const OCC_CHIP={teacher_scholar:{cls:'teacher',emoji:'🎓',label:'學者教師'},
  investigator:{cls:'investigator',emoji:'🔍',label:'調查員'}};

const SOUL_LABELS={benevolence:'慈愛',compassion:'憐憫',selfishness:'自私',
  messiah:'救世',existentialism:'存在',sacrifice:'犧牲',lifeWeight:'生命重'};
const SOUL_COLORS={benevolence:'#22c55e',compassion:'#14b8a6',selfishness:'#64748b',
  messiah:'#38bdf8',existentialism:'#fbbf24',sacrifice:'#f43f5e',lifeWeight:'#a855f7'};

const PERSONA = location.pathname.split('/').pop();
let DATA=null;

function $(id){return document.getElementById(id)}
function h(s){if(s==null)return '';return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c])}

async function loadDetail(){
  $('loading').classList.remove('hidden');
  try{
    const r = await fetch(`/api/lobster-v2-next-detail/${PERSONA}`);
    DATA = await r.json();
    if(DATA.error){
      document.body.innerHTML = `<div style="padding:40px;color:var(--red)">${h(DATA.error)}</div>`;
      return;
    }
    renderHeader();
    renderOverview();
    renderBrain();
    renderOccupation();
    renderTemplateSurvival();
    renderMirror();
    renderDivine();
    renderLoungeHistory();
    $('last-update').textContent = 'updated '+DATA.generated_at;
  }catch(e){
    console.error(e);
    $('last-update').textContent = '錯誤:'+e.message;
  }
  $('loading').classList.add('hidden');
}

function renderHeader(){
  const m = DATA.memory;
  const o = m.occupation || {};
  const c = COLOR[PERSONA]||'#888';
  $('lob-title').innerHTML = `人 <span style="color:${c}">${h(PERSONA)}</span>`;
  $('mbti-chip').textContent = pickMBTI(PERSONA);
  if(o.is_active && o.title){
    const def=OCC_CHIP[o.title];
    $('occ-chip-host').innerHTML = `<span class="occ-chip ${def?.cls||''}">${def?.emoji||'🎓'} ${h(o.title_zh||o.title)}</span>`;
  }
  const status = computeStatus(m);
  $('status-pill').className = 'status-pill '+status;
  $('status-pill').textContent = STATUS_ZH[status]||status;
}

function pickMBTI(name){
  const MBTI={'hexclaw':'ISFJ','pincerbot':'ESTJ','norika_oda':'INTJ','vortexiq':'INFP',
    'snaplex':'INTJ','prismbit':'INFJ','clawtrix':'ENTP','ragclaw':'ESTP',
    'blazepaw':'ENFP','stonefang':'ISTP','emberling':'INFP','sparkrill':'ENTP',
    'gauntlet':'ENTJ','rushfin':'ESFP','nullpinch':'INTP','brineledger':'ISFJ',
    'omenwake':'ENFJ','mirrorcalm':'INFJ','flarecub':'ENFJ','basaltrook':'ISTJ',
    'elder':'INFJ'};
  return MBTI[name]||'?';
}

function computeStatus(m){
  const ts = m.templateSurvival||{};
  const et = (m.cognitiveExtensions||{}).existentialThreat||{};
  const tr = et.tiamatExtinctionRule||{};
  if(ts.publicExecutionStage || ts.metamorphosisStage) return 'in_ritual';
  if(ts.deletionCandidate) return 'deletion_candidate';
  const dread = +(et.annihilationDread||0);
  const press = +(tr.extinctionPressure||0);
  if(dread>=0.7 || press>=0.6) return 'crisis';
  if((ts.violationCount||0)>=10 || dread>=0.4) return 'pressure';
  return 'normal';
}

// ───────────────────────── OVERVIEW ─────────────────────────
function renderOverview(){
  const m = DATA.memory;
  const sp = m.soulParams || {};
  const tm = m.tiamatMission || {};
  const r = m.rank || {};
  const ce = m.cognitiveExtensions || {};
  const et = ce.existentialThreat || {};
  const tr = et.tiamatExtinctionRule || {};
  const ea = ce.emotionalArchitecture || {};
  const se = ea.socialEmotions || {};
  const sb = m.settledBetting || {};
  const ts = m.templateSurvival || {};
  const sbeh = m.socialBehavior || {};
  const spref = m.socialPreference || {};
  const emo = m.emotionalState || {};

  // soul radar big
  const radar = soulRadarBig(sp, 200);

  // tiamat
  const tiamatPct = Math.round(100 * (tr.remaining||100)/(tr.lossLimit||100));

  // status cards data
  const violations = ts.violationCount||0;
  const wrPct = Math.round((sb.winRate||0)*100);
  const recentWr = Math.round((sb.recentWinRate||0)*100);
  const voidPct = Math.round((sb.voidRate||0)*100);
  const pnl = sb.totalPnL||0;

  $('pane-overview').innerHTML = `
    <div class="section">
      <div class="section-head">📜 自我陳述 / 絕對使命</div>
      ${tm.absoluteDirective ? `<div style="font-style:italic;color:var(--gold);padding:8px 0;font-size:13px">${h(tm.absoluteDirective)}</div>` : ''}
      ${(tm.understanding||{}).myPersonalStrategy ? `<div style="color:var(--text2);font-size:12px">個人策略:${h(tm.understanding.myPersonalStrategy)}</div>` : ''}
    </div>

    <div class="grid-2">
      <div class="section">
        <div class="section-head">💫 靈魂參數 soulParams</div>
        <div class="soul-big-wrap">
          ${radar}
          <div class="soul-legend">
            ${['benevolence','compassion','selfishness','messiah','existentialism','sacrifice','lifeWeight'].map(k => `
              <div class="soul-legend-item">
                <span style="color:${SOUL_COLORS[k]}">${SOUL_LABELS[k]}</span>
                <b style="color:${SOUL_COLORS[k]}">${Math.round((sp[k]||0)*100)}%</b>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">📊 戰績 / 校準</div>
        <div class="stat-cards">
          <div class="stat-card ${wrPct>=55?'good':(wrPct<40?'crisis':'')}"><div class="stat-card-label">勝率</div><div class="stat-card-val">${wrPct}%</div><div class="stat-card-sub">n=${sb.resolved||0}</div></div>
          <div class="stat-card ${recentWr>=55?'good':(recentWr<40?'warn':'')}"><div class="stat-card-label">近況</div><div class="stat-card-val">${recentWr}%</div></div>
          <div class="stat-card ${voidPct>50?'crisis':(voidPct>30?'warn':'')}"><div class="stat-card-label">void</div><div class="stat-card-val">${voidPct}%</div></div>
          <div class="stat-card ${pnl>=0?'good':'crisis'}"><div class="stat-card-label">PnL</div><div class="stat-card-val">${pnl>0?'+':''}${(pnl/1000).toFixed(1)}k</div></div>
          <div class="stat-card"><div class="stat-card-label">專長對齊</div><div class="stat-card-val">${Math.round((sb.specialtyAlignment||0)*100)}%</div></div>
          <div class="stat-card"><div class="stat-card-label">研究次數</div><div class="stat-card-val">${sb.researchCount||0}</div></div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="section">
        <div class="section-head">⚔ Tiamat / 存在威脅</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-k">剩餘命數</span><span class="kv-v">${tr.remaining||100}/${tr.lossLimit||100}</span></div>
          <div class="kv"><span class="kv-k">滅絕壓力</span><span class="kv-v ${(tr.extinctionPressure||0)>0.6?'crisis':''}">${Math.round((tr.extinctionPressure||0)*100)}%</span></div>

// ───────────────────────── SOUL RADAR BIG ─────────────────────────
function soulRadarBig(sp, size){
  const r = size/2 - 24, cx = size/2, cy = size/2;
  const keys = ['benevolence','compassion','lifeWeight','sacrifice','existentialism','messiah','selfishness'];
  const n = keys.length;
  const polygons = [0.25,0.5,0.75,1].map(s=>{
    const pts = keys.map((k,i)=>{
      const a=(Math.PI*2*i/n)-Math.PI/2;
      return `${cx+r*s*Math.cos(a)},${cy+r*s*Math.sin(a)}`;
    });
    return `<polygon points="${pts.join(' ')}" fill="none" stroke="#27314a" stroke-width="0.5"/>`;
  }).join('');
  const labels = keys.map((k,i)=>{
    const a=(Math.PI*2*i/n)-Math.PI/2;
    const lr = r+14;
    const x = cx+lr*Math.cos(a), y = cy+lr*Math.sin(a);
    return `<text x="${x}" y="${y}" fill="${SOUL_COLORS[k]}" font-size="9" text-anchor="middle" dominant-baseline="middle">${SOUL_LABELS[k].charAt(0)}</text>`;
  }).join('');
  const dataPts = keys.map((k,i)=>{
    const a=(Math.PI*2*i/n)-Math.PI/2;
    const v = Math.max(0,Math.min(1, sp[k]||0));
    return `${cx+r*v*Math.cos(a)},${cy+r*v*Math.sin(a)}`;
  }).join(' ');
  return `<svg class="soul-big-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${polygons}${labels}
    <polygon points="${dataPts}" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.8"/>
  </svg>`;
}

// ───────────────────────── TAB SWITCH ─────────────────────────
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const target = b.dataset.tab;
    document.querySelector(`.tab-pane[data-pane="${target}"]`).classList.add('active');
    if(target==='v1') renderV1();
  };
});
