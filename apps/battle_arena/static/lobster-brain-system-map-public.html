<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Human Mind System Map</title>
  <style>
    :root{
      --bg:#07080a;
      --panel:#0d0e11;
      --panel2:#131417;
      --line:rgba(255,255,255,.07);
      --text:#eceff4;
      --muted:#6e7a8a;
      --blue:#5b9cf6;
      --cyan:#45d4c4;
      --yellow:#e8c547;
      --orange:#e8894a;
      --pink:#e06080;
      --violet:#a78bfa;
      --green:#4ecb8a;
      --red:#e05c5c;
      --card:#15171c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#07080a;
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing:0;
    }
    header{
      padding:22px 28px 14px;
      border-bottom:1px solid rgba(255,255,255,.07);
      background:rgba(7,8,10,.92);
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(12px);
    }
    h1{margin:0;font-size:28px;line-height:1.15}
    .subtitle{margin-top:7px;color:var(--muted);font-size:14px}
    .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.1);
      background:#0d0e11;
      border-radius:8px;
      color:#9aa8b8;
      font-size:12px;
      font-weight:700;
    }
    .dot{width:10px;height:10px;border-radius:50%}
    main{padding:20px 24px 44px}
    .grid{
      display:grid;
      grid-template-columns: minmax(980px, 1fr) 420px;
      gap:18px;
      align-items:start;
    }
    .map-wrap,.side,.section{
      background:rgba(13,14,17,.94);
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px;
      box-shadow:0 18px 60px rgba(0,0,0,.25);
    }
    .map-wrap{overflow:auto}
    svg{display:block;min-width:1180px;width:100%;height:980px;background:#07080a}
    .node rect{
      stroke-width:1.4;
      rx:10;
      ry:10;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));
    }
    .node .title{font-size:14px;font-weight:900;fill:#eceff4}
    .node .body{font-size:11px;fill:#a8bed2}
    .node .small{font-size:10px;fill:#7892a8}
    .lane-title{font-size:13px;font-weight:900;fill:#6f879d;text-transform:uppercase;letter-spacing:2px}
    .edge{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2;opacity:.82}
    .edge.hot{stroke:var(--orange)}
    .edge.learn{stroke:var(--cyan)}
    .edge.decision{stroke:var(--yellow)}
    .edge.report{stroke:var(--violet)}
    .edge.dash{stroke:var(--blue)}
    .edge.warn{stroke:var(--red);stroke-dasharray:6 6}
    marker path{fill:#4a6a8a}
    .formula{
      margin:0;
      padding:12px;
      background:#07080a;
      border:1px solid rgba(255,255,255,.08);
      border-radius:8px;
      color:#b8c8d8;
      font-size:12px;
      line-height:1.55;
      white-space:pre-wrap;
    }
    .side{padding:16px}
    .side h2,.section h2{margin:0 0 10px;font-size:18px}
    .side p{color:#6e7a8a;line-height:1.55;margin:0 0 12px;font-size:13px}
    .stack{display:grid;gap:12px}
    .mini{
      padding:12px;
      border:1px solid rgba(255,255,255,.08);
      background:#0d0e11;
      border-radius:8px;
    }
    .mini h3{margin:0 0 7px;font-size:14px}
    .mini ul{margin:0;padding-left:18px;color:#6e7a8a;font-size:12px;line-height:1.55}
    .sections{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    .section{padding:16px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
    th{text-align:left;color:#82a2bd;text-transform:uppercase;letter-spacing:1.5px;font-size:11px}
    td{color:#b0bfce}
    .tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#0d0e11;color:#5b9cf6;font-size:11px;font-weight:800}
    .node-id{font-size:10px;font-weight:900;fill:#07080a}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;border-radius:6px;background:#131417;color:#5b9cf6;font-size:12px;font-weight:900;margin-right:8px}
    .gap{color:#ff9a9a}
    .ok{color:#82ee99}
    .warn{color:#ffd16b}
    @media (max-width: 1200px){
      .grid,.sections{grid-template-columns:1fr}
      svg{min-width:1120px}
    }
  </style>
</head>
